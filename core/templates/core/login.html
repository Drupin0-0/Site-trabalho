<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        body {
            background: #000;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .mask {
            border-radius: 50%;
            height: 800px;
            width: 800px;
            overflow: hidden;
            position: absolute;
            z-index: 1;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .mask__inner {
            animation: rotate-sphere 40s infinite linear;
            background-image: url('https://s3-us-west-2.amazonaws.com/s.cdpn.io/17271/lroc_color_poles_1k.jpg');
            background-repeat: repeat-x;
            background-size: cover;
            height: 100%;
            width: 100%;
            position: relative;
            box-shadow: inset 0 0 100px rgba(0, 0, 0, 1);
        }

        .mask__inner::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            border-radius: 50%;
            box-shadow: inset -60px 20px 80px 20px rgba(0, 0, 0, 0.9);
            z-index: 2;
        }

        @keyframes rotate-sphere {
            from { background-position: 1000px 0; }
            to { background-position: 0 0; }
        }

        .login-box {
            position: relative;
            z-index: 10;
            width: 350px;
            padding: 40px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.8);
            color: #fff;
        }

        .login-box h2 {
            margin: 0 0 30px 0;
            text-align: center;
            font-size: 28px;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .login-box p {
            margin-bottom: 20px;
        }

        .login-box label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.8);
        }

        .login-box input[type="text"],
        .login-box input[type="password"],
        .login-box input[type="email"] {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            box-sizing: border-box;
            outline: none;
            transition: 0.3s;
        }

        .login-box input:focus {
            border-color: rgba(255, 255, 255, 0.5);
            background: rgba(255, 255, 255, 0.1);
        }

        .help {
            display: flex;
            align-items: center;
            font-size: 13px;
            margin-bottom: 20px;
            color: rgba(255, 255, 255, 0.7);
        }

        .help input {
            margin-right: 10px;
            accent-color: #fff;
        }

        button[type="submit"] {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #fff;
            color: #000;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        button[type="submit"]:hover {
            background: rgba(255, 255, 255, 0.8);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="mask">
        <div class="mask__inner"></div>
    </div>

    <div class="login-box">
        <h2>Login</h2>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            
            <div class="help">
                <input type="checkbox" name="remember" id="id_remember">
                <label for="id_remember" style="margin-bottom: 0;">Lembrar de mim</label>
            </div>

            <button type="submit">Entrar</button>
        </form>
    </div>

</body>
</html>
